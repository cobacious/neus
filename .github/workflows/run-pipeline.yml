name: Run Neus Pipeline

on:
  # Triggered manually or via external cron (cron-job.org)
  workflow_dispatch:

# Ensure only one pipeline run executes at a time; subsequent runs queue sequentially
concurrency:
  group: neus-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Cache pnpm store for faster dependency installation
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Cache node_modules for faster builds
      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Prisma generated client
      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            packages/db/node_modules/.prisma
            packages/db/node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-${{ hashFiles('packages/db/prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Generate Prisma Client
        run: pnpm --filter @neus/db exec prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"

      - name: Build database package
        run: pnpm --filter @neus/db build

      - name: Run pipeline
        run: pnpm pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUMMARY_MODEL: gemini-flash-latest
          # Pipeline limits (0 = unlimited to process all incoming articles without backlog)
          MAX_EMBEDDINGS: 0
          MAX_CONTENT_EXTRACTION: 0
          TOKEN_LIMIT: 0
          NODE_ENV: production

      # Report pipeline completion & send webhook alert if configured
      - name: Pipeline Summary & Alert
        if: always()
        run: |
          echo "Pipeline completed with status: ${{ job.status }}"
          echo "Scheduled run time: $(date -u)"

          # Optional webhook alert (e.g. Discord or Slack) on failure
          if [ "${{ job.status }}" != "success" ] && [ -n "${{ secrets.ALERT_WEBHOOK_URL }}" ]; then
            echo "Sending failure alert to configured webhook..."
            curl -s -X POST -H 'Content-type: application/json' \
              --data '{"text":"⚠️ [Neus Pipeline] Scheduled run failed! Check GitHub Actions logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "${{ secrets.ALERT_WEBHOOK_URL }}" || true
          fi
